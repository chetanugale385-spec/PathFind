<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFind AI | ZCOER Pune</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex items-center justify-center p-4">

    <div class="fixed top-0 -left-4 w-72 h-72 bg-blue-600 rounded-full filter blur-3xl opacity-10 animate-blob"></div>
    <div class="fixed bottom-0 -right-4 w-72 h-72 bg-purple-600 rounded-full filter blur-3xl opacity-10 animate-blob" style="animation-delay: 2s;"></div>

    <div class="relative w-full max-w-lg bg-slate-900/80 backdrop-blur-md border border-slate-800 p-8 rounded-3xl shadow-2xl">
        
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                PathFind AI
            </h1>
            <p class="text-slate-400 mt-2 text-sm tracking-wide uppercase">AI Career Roadmap Generator</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 ml-1">SELECT BRANCH</label>
                <select id="branch" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl outline-none focus:border-blue-500">
                    <option value="AIML">AI & Machine Learning</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Cyber Security">Cyber Security</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 ml-1">FIELD OF INTEREST</label>
                <input type="text" id="interest" placeholder="e.g. Web Development" 
                       class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl outline-none focus:border-blue-500">
            </div>

            <button id="generate-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold shadow-lg shadow-blue-500/20 transition-all active:scale-95">
                Generate Roadmap
            </button>
        </div>

        <div id="output-section" class="mt-8 hidden">
            <div class="flex items-center gap-2 mb-4 border-t border-slate-800 pt-6">
                <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                <h2 class="text-lg font-bold text-slate-200">Personalized Roadmap</h2>
            </div>
            <div id="roadmap-container" class="p-5 bg-slate-800/50 border border-slate-700 rounded-2xl text-slate-300 leading-relaxed text-sm">
                </div>
        </div>

        <p class="text-center text-slate-600 text-[9px] mt-8 tracking-widest uppercase">ZCOER Pune • Project by Chetan</p>
    </div>

    <script>
    document.getElementById('generate-btn').addEventListener('click', () => {
        const branch = document.getElementById('branch').value;
        const interest = document.getElementById('interest').value.toLowerCase();
        const outputSection = document.getElementById('output-section');
        const roadmapContainer = document.getElementById('roadmap-container');
        const button = document.getElementById('generate-btn');

        if (!interest.trim()) { alert("Please enter an interest!"); return; }

        button.innerText = "Analyzing Skill Gap...";
        button.disabled = true;

        setTimeout(() => {
            outputSection.classList.remove('hidden');
            
            let roadmapContent = "";

            // Custom Roadmaps based on keywords
            if (interest.includes("web") || interest.includes("frontend") || interest.includes("backend")) {
                roadmapContent = `
                    <div class="space-y-4">
                        <p class="text-blue-400 font-semibold italic">Web Development Roadmap for ${branch}:</p>
                        <div class="flex gap-3"><span class="text-blue-500 font-bold">01.</span> <p><b>HTML/CSS & JS:</b> Master the holy trinity of web. Focus on Responsive Design.</p></div>
                        <div class="flex gap-3"><span class="text-blue-500 font-bold">02.</span> <p><b>Frameworks:</b> Learn React.js or Node.js to build dynamic web applications.</p></div>
                        <div class="flex gap-3"><span class="text-blue-500 font-bold">03.</span> <p><b>Database:</b> Connect your app with MongoDB or PostgreSQL for data storage.</p></div>
                        <div class="flex gap-3"><span class="text-blue-500 font-bold">04.</span> <p><b>Deployment:</b> Host your projects on Vercel or Netlify and update your Portfolio.</p></div>
                    </div>`;
            } else if (interest.includes("python") || interest.includes("ai") || interest.includes("ml")) {
                roadmapContent = `
                    <div class="space-y-4">
                        <p class="text-emerald-400 font-semibold italic">AI & Python Roadmap for ${branch}:</p>
                        <div class="flex gap-3"><span class="text-emerald-500 font-bold">01.</span> <p><b>Python Mastery:</b> Focus on Libraries like NumPy, Pandas, and Matplotlib.</p></div>
                        <div class="flex gap-3"><span class="text-emerald-500 font-bold">02.</span> <p><b>ML Algorithms:</b> Understand Linear Regression, Decision Trees, and Clustering.</p></div>
                        <div class="flex gap-3"><span class="text-emerald-500 font-bold">03.</span> <p><b>Deep Learning:</b> Explore Neural Networks using TensorFlow or PyTorch.</p></div>
                        <div class="flex gap-3"><span class="text-emerald-500 font-bold">04.</span> <p><b>Project:</b> Build a Predictor App or a Chatbot and host it on Streamlit.</p></div>
                    </div>`;
            } else if (interest.includes("cyber") || interest.includes("security") || interest.includes("hacking")) {
                roadmapContent = `
                    <div class="space-y-4">
                        <p class="text-red-400 font-semibold italic">Cyber Security Roadmap for ${branch}:</p>
                        <div class="flex gap-3"><span class="text-red-500 font-bold">01.</span> <p><b>Networking:</b> Master TCP/IP, DNS, and HTTP protocols deeply.</p></div>
                        <div class="flex gap-3"><span class="text-red-500 font-bold">02.</span> <p><b>Linux & Tools:</b> Learn Kali Linux, Nmap, and Wireshark for scanning.</p></div>
                        <div class="flex gap-3"><span class="text-red-500 font-bold">03.</span> <p><b>Web Security:</b> Study OWASP Top 10 vulnerabilities like SQL Injection.</p></div>
                        <div class="flex gap-3"><span class="text-red-500 font-bold">04.</span> <p><b>Certification:</b> Prepare for CompTIA Security+ or CEH fundamentals.</p></div>
                    </div>`;
            } else {
                // Default Roadmap for any other interest
                roadmapContent = `
                    <div class="space-y-4">
                        <p class="text-blue-400 font-semibold italic">Career Roadmap for ${interest}:</p>
                        <div class="flex gap-3"><span class="text-blue-500 font-bold">01.</span> <p><b>Foundations:</b> Master the core concepts and theory of ${interest}.</p></div>
                        <div class="flex gap-3"><span class="text-blue-500 font-bold">02.</span> <p><b>Practical Tools:</b> Learn the most popular software/tools used in this field.</p></div>
                        <div class="flex gap-3"><span class="text-blue-500 font-bold">03.</span> <p><b>Certifications:</b> Complete a specialized course to validate your skills.</p></div>
                        <div class="flex gap-3"><span class="text-blue-500 font-bold">04.</span> <p><b>Job Readiness:</b> Build a niche project and start networking on LinkedIn.</p></div>
                    </div>`;
            }

            roadmapContainer.innerHTML = roadmapContent;
            button.innerText = "Generate Roadmap";
            button.disabled = false;
            outputSection.scrollIntoView({ behavior: 'smooth' });
        }, 1200);
    });
    </script>
    
</body>
</html>
