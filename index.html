<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFind AI | Career Roadmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

    <div class="fixed top-0 -left-4 w-72 h-72 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="fixed bottom-0 -right-4 w-72 h-72 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>

    <div class="relative w-full max-w-lg bg-slate-900/50 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                PathFind AI
            </h1>
            <p class="text-slate-400 mt-2 text-sm font-medium tracking-wide uppercase">AI-Powered Career Navigator</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-2 ml-1">SELECT YOUR BRANCH</label>
                <select id="branch" class="w-full p-4 bg-slate-800/50 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all cursor-pointer">
                    <option value="AIML">AI & Machine Learning</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Computer Science">Computer Science</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-2 ml-1">YOUR INTEREST</label>
                <input type="text" id="interest" placeholder="e.g. Python, Web Dev, AI Agents" 
                       class="w-full p-4 bg-slate-800/50 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <button id="generate-btn" class="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 rounded-2xl font-bold text-white shadow-lg shadow-blue-500/30 transform active:scale-95 transition-all">
                Generate Roadmap
            </button>
        </div>

        <div id="output-section" class="mt-10 hidden animate-fade-in">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                <h2 class="text-lg font-bold text-slate-200">Your AI Roadmap</h2>
            </div>
            <div id="roadmap-container" class="p-6 bg-slate-800/30 border border-slate-700 rounded-2xl text-slate-300 leading-relaxed text-sm">
                </div>
        </div>

        <p class="text-center text-slate-600 text-[10px] mt-8 uppercase tracking-[0.2em]">Designed for ZCOER Pune</p>
    </div>

    <script>
        const API_KEY = "AIzaSyA5nFFYWKPDRYZUtMY4JPqAzNPCxjqXSJY"; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        document.getElementById('generate-btn').addEventListener('click', async () => {
            const branch = document.getElementById('branch').value;
            const interest = document.getElementById('interest').value;
            const button = document.getElementById('generate-btn');
            const outputSection = document.getElementById('output-section');
            const roadmapContainer = document.getElementById('roadmap-container');

            if (!interest.trim()) { alert("Please enter an interest!"); return; }

            button.innerText = "Analyzing Skills...";
            button.disabled = true;
            outputSection.classList.add('hidden');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Create a professional 4-step learning roadmap for a B.Tech ${branch} student who wants to master ${interest}. Use bullet points and keep it very practical.` }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let roadmapText = data.candidates[0].content.parts[0].text;
                    // Converting markdown-style bullets to clean line breaks
                    roadmapText = roadmapText.replace(/\*/g, '•');
                    
                    outputSection.classList.remove('hidden');
                    roadmapContainer.innerHTML = `<div class="whitespace-pre-wrap font-medium">${roadmapText}</div>`;
                } else {
                    throw new Error("API Limit reached");
                }

            } catch (error) {
                console.error(error);
                alert("Connection slow! Kripya 5 seconds baad phir try karein.");
            } finally {
                button.innerText = "Generate Roadmap";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
