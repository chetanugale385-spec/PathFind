<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFind AI | Chetan Ugale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .bento-card { border-radius: 24px; padding: 24px; transition: 0.3s; }
        .bento-card:hover { border-color: #3b82f6; background: rgba(30, 41, 59, 0.5); }
    </style>
</head>
<body class="p-5 md:p-10">

    <header class="max-w-6xl mx-auto mb-10 text-center">
        <h1 class="text-4xl font-black bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent italic">PathFind AI</h1>
        <p class="text-slate-500 text-sm mt-2 tracking-widest uppercase">ZCOER Engineering Career Architect</p>
    </header>

    <div class="max-w-xl mx-auto glass p-8 rounded-[2rem] mb-12 shadow-2xl">
        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-blue-400 uppercase mb-2">Select Branch</label>
                <select id="branch" class="w-full bg-slate-900 border border-white/10 p-4 rounded-xl outline-none focus:ring-2 ring-blue-500">
                    <option value="AIML">AIML</option>
                    <option value="Computer">Computer</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Civil">Civil</option>
                    <option value="ENTC">E&TC</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-blue-400 uppercase mb-2">What's your Interest?</label>
                <input type="text" id="interest" placeholder="e.g. Web Dev, EV, Robotics" class="w-full bg-slate-900 border border-white/10 p-4 rounded-xl outline-none focus:ring-2 ring-blue-500">
            </div>
            <button id="generate-btn" class="w-full bg-blue-600 p-4 rounded-xl font-bold uppercase tracking-widest hover:bg-blue-500 transition-all active:scale-95 shadow-lg shadow-blue-500/20">
                Generate Roadmap 🚀
            </button>
        </div>
    </div>

    <div id="roadmap-container" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
        </div>

    <footer class="mt-20 text-center">
        <div class="inline-block border border-white/10 px-6 py-2 rounded-full text-[10px] text-slate-500 uppercase tracking-[0.3em]">
            Developed by <span class="text-blue-400 font-bold">Chetan Rameshwar Ugale</span>
        </div>
    </footer>

    <script>
        const btn = document.getElementById('generate-btn');
        const container = document.getElementById('roadmap-container');

        btn.addEventListener('click', async () => {
            const branch = document.getElementById('branch').value;
            const interest = document.getElementById('interest').value;

            if(!interest) return alert("Please enter your interest!");

            btn.innerText = "Consulting AI...";
            btn.disabled = true;
            container.classList.remove('hidden');
            container.innerHTML = `<div class="col-span-full text-center py-10 animate-pulse text-slate-400">Crafting your career path...</div>`;

            try {
                // IMPORTANT: Tab humne yahi API URL use kiya tha
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        prompt: `Create a 4-year engineering roadmap for ${branch} with focus on ${interest}. Divide by YEAR 1, YEAR 2, YEAR 3, YEAR 4.` 
                    })
                });

                const data = await response.json();
                
                if(data.roadmap) {
                    // Split the text into 4 parts based on Years
                    const years = data.roadmap.split(/YEAR \d:|YEAR \d/i).filter(s => s.trim().length > 10).slice(0, 4);
                    
                    container.innerHTML = years.map((text, i) => `
                        <div class="glass bento-card border border-white/5">
                            <h3 class="text-blue-400 font-black mb-3">YEAR 0${i+1}</h3>
                            <p class="text-slate-400 text-sm leading-relaxed">${text.replace(/\*/g, '').replace(/\n/g, '<br>')}</p>
                        </div>
                    `).join('');
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-red-500 text-center">Connection Failed. Check Vercel Logs.</div>`;
            } finally {
                btn.innerText = "Generate Roadmap 🚀";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
