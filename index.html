<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFind - AI Career Roadmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-bg {
            0%, 100% { background-color: rgba(30, 41, 59, 0.5); }
            50% { background-color: rgba(30, 41, 59, 0.8); }
        }
        .animate-loading { animation: pulse-bg 2s infinite; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

    <div class="max-w-md mx-auto p-6">
        <header class="text-center mb-10 pt-4">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">PathFind AI</h1>
            <p class="text-slate-400 text-xs mt-2 tracking-widest uppercase">Smart Career Navigation</p>
        </header>
        
        <div class="space-y-6">
            <div class="bg-slate-800/40 p-1 rounded-2xl border border-slate-700">
                <label class="block text-[10px] font-bold text-slate-500 mb-1 ml-4 mt-2 uppercase">Select Your Branch</label>
                <select id="branch" class="w-full p-4 bg-transparent outline-none text-sm font-medium">
                    <option value="AIML">B.Tech AIML</option>
                    <option value="Computer">Computer Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="ENTC">E&TC Engineering</option>
                </select>
            </div>

            <div class="bg-slate-800/40 p-1 rounded-2xl border border-slate-700">
                <label class="block text-[10px] font-bold text-slate-500 mb-1 ml-4 mt-2 uppercase">What is your Interest?</label>
                <input type="text" id="interest" placeholder="e.g. Web Dev, AI Research" 
                       class="w-full p-4 bg-transparent outline-none text-sm placeholder:text-slate-600">
            </div>

            <button id="generate-btn" class="w-full py-5 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 rounded-2xl font-bold shadow-xl shadow-blue-900/20 transition-all active:scale-95">
                Generate AI Roadmap
            </button>
        </div>

        <div id="output-section" class="mt-10 hidden">
            <div class="flex items-center gap-3 mb-6 border-t border-slate-800 pt-8">
                <div class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.6)]"></div>
                <h2 class="text-xl font-bold text-slate-100 tracking-tight">Your Custom Path</h2>
            </div>
            
            <div id="roadmap-container">
                </div>
        </div>

        <footer class="text-center text-slate-600 text-[10px] mt-16 tracking-[0.2em] uppercase pb-8">
            ZCOER Pune • Developed by Chetan Ugale
        </footer>
    </div>

    <script>
        // UPDATED: Using your new Vercel URL
        const API_URL = "https://path-find-one.vercel.app/generate"; 

        document.getElementById('generate-btn').addEventListener('click', async () => {
            const branch = document.getElementById('branch').value;
            const interest = document.getElementById('interest').value;
            const button = document.getElementById('generate-btn');
            const outputSection = document.getElementById('output-section');
            const roadmapContainer = document.getElementById('roadmap-container');

            if (!interest.trim()) { 
                alert("Please type an interest first!"); 
                return; 
            }

            // UI State - Loading
            button.innerText = "Analyzing & Generating...";
            button.disabled = true;
            outputSection.classList.remove('hidden');
            roadmapContainer.innerHTML = `
                <div class="p-6 bg-slate-800/50 border border-slate-700 rounded-3xl animate-loading">
                    <div class="h-4 bg-slate-700 rounded-full w-3/4 mb-4 animate-pulse"></div>
                    <div class="h-4 bg-slate-700 rounded-full w-full mb-4 animate-pulse"></div>
                    <div class="h-4 bg-slate-700 rounded-full w-2/3 animate-pulse"></div>
                </div>
            `;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: `Provide a detailed 4-year career roadmap for a B.Tech ${branch} student who is interested in ${interest}. Include skills to learn and project ideas.` 
                    })
                });

                if (!response.ok) throw new Error("Server response error");

                const data = await response.json();

                if (data.roadmap) {
                    // Success UI
                    roadmapContainer.innerHTML = `
                        <div class="p-6 bg-slate-800/80 border border-slate-700 rounded-3xl shadow-2xl backdrop-blur-sm">
                            <div class="prose prose-invert max-w-none">
                                <p class="whitespace-pre-wrap text-slate-300 text-sm leading-relaxed font-sans">
                                    ${data.roadmap.replace(/\*/g, '•')}
                                </p>
                            </div>
                        </div>
                        <div class="mt-4 p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl text-center">
                            <p class="text-emerald-400 text-[10px] font-bold uppercase tracking-widest">Roadmap Ready! All the best for your journey.</p>
                        </div>
                    `;
                    
                    window.scrollTo({ top: outputSection.offsetTop - 20, behavior: 'smooth' });
                }
            } catch (error) {
                console.error(error);
                roadmapContainer.innerHTML = `
                    <div class="p-6 bg-red-900/20 border border-red-900/30 rounded-3xl text-center">
                        <p class="text-red-400 text-sm">Oops! Something went wrong. Please check if the backend is live or try again.</p>
                        <button onclick="location.reload()" class="mt-4 text-xs underline text-red-300">Retry Connection</button>
                    </div>
                `;
            } finally {
                button.innerText = "Generate AI Roadmap";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
