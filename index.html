<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFind - AI Career Roadmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">

    <div class="max-w-md mx-auto p-6">
        <h1 class="text-3-xl font-bold text-center mb-8 text-blue-400">PathFind AI</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase">Your Branch</label>
                <select id="branch" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl outline-none focus:border-blue-500 text-sm">
                    <option value="AIML">B.Tech AIML</option>
                    <option value="Computer">Computer Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="ENTC">E&TC Engineering</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-2 uppercase">Field of Interest</label>
                <input type="text" id="interest" placeholder="e.g. Web Development, Cyber Security" 
                       class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl outline-none focus:border-blue-500 text-sm">
            </div>

            <button id="generate-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold shadow-lg transition-all active:scale-95">
                Generate Roadmap
            </button>
        </div>

        <div id="output-section" class="mt-8 hidden">
            <div class="flex items-center gap-2 mb-4 border-t border-slate-800 pt-6">
                <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                <h2 class="text-lg font-bold text-slate-200">Personalized Roadmap</h2>
            </div>
            
            <div id="roadmap-container" class="space-y-4">
                </div>
        </div>

        <p class="text-center text-slate-600 text-[10px] mt-12 tracking-widest uppercase">
            ZCOER Pune • Project by Chetan
        </p>
    </div>
<script>
    const API_URL = "https://pathfind.onrender.com/generate"; 

    document.getElementById('generate-btn').addEventListener('click', async () => {
        const branch = document.getElementById('branch').value;
        const interest = document.getElementById('interest').value;
        const button = document.getElementById('generate-btn');
        const outputSection = document.getElementById('output-section');
        const roadmapContainer = document.getElementById('roadmap-container');

        if (!interest.trim()) { alert("Interest empty hai!"); return; }

        button.innerText = "Connecting...";
        button.disabled = true;

        try {
            // Mobile par request check karne ke liye timeout
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 25000); // 25s timeout

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    prompt: `B.Tech ${branch} student interested in ${interest}` 
                }),
                signal: controller.signal
            });

            clearTimeout(id);

            if (!response.ok) {
                const errData = await response.json();
                alert("Backend Error: " + (errData.message || response.status));
                return;
            }

            const data = await response.json();
            if (data.roadmap) {
                outputSection.classList.remove('hidden');
                roadmapContainer.innerHTML = `<div class="p-4 bg-slate-800 rounded-xl whitespace-pre-wrap text-sm">${data.roadmap.replace(/\*/g, '•')}</div>`;
                window.scrollTo(0, document.body.scrollHeight);
            }

        } catch (error) {
            // Ye alert mobile par sabse kaam aayega
            alert("Connection Failed!\n1. Check if https://pathfind.onrender.com is opening in browser.\n2. Render might be starting up (Wait 30s).\n3. Error: " + error.message);
        } finally {
            button.innerText = "Generate Roadmap";
            button.disabled = false;
        }
    });
</script>
    
    
</body>
</html>
