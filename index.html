<script>
    // 1. URL ekdum dhyan se check karein (End mein /generate hona zaroori hai)
    const API_URL = "https://pathfind.onrender.com/generate"; 

    document.getElementById('generate-btn').addEventListener('click', async () => {
        const branch = document.getElementById('branch').value;
        const interest = document.getElementById('interest').value;
        const button = document.getElementById('generate-btn');
        const outputSection = document.getElementById('output-section');
        const roadmapContainer = document.getElementById('roadmap-container');

        if (!interest) { alert("Please enter a tech interest!"); return; }

        // UI update
        button.innerText = "Connecting to AI...";
        button.disabled = true;
        outputSection.classList.add('hidden');

        try {
            // 2. Fetch call with explicit settings
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ prompt: `B.Tech student in ${branch}. Interest: ${interest}.` })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server Response: ${response.status} - ${errorText}`);
            }

            const data = await response.json();
            
            // 3. Render Output
            outputSection.classList.remove('hidden');
            roadmapContainer.innerHTML = `
                <div class="p-6 bg-slate-900 border border-blue-500/30 rounded-2xl shadow-xl">
                    <p class="text-white whitespace-pre-wrap leading-relaxed">${data.roadmap}</p>
                </div>`;

        } catch (error) {
            // 4. Detailed Error for Troubleshooting
            console.error("Connection Error:", error);
            alert("ASLI ERROR YAHAN HAI:\n" + error.message + "\n\nTip: Check if https://pathfind.onrender.com/ is awake!");
        } finally {
            button.innerText = "Generate My Roadmap";
            button.disabled = false;
        }
    });
</script>
