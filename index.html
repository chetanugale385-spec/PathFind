<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFind AI | Universal Career Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #1e293b, #020617);
            color: #f8fafc;
            min-height: 100-vh;
        }
        .glass { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(14px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .bento-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bento-card:hover {
            transform: translateY(-8px);
            background: rgba(30, 41, 59, 0.9);
            border-color: #3b82f6;
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex flex-col">

    <nav class="p-6 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-xl flex items-center justify-center font-black text-white italic shadow-lg shadow-blue-500/20">P</div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tighter gradient-text">PathFind AI</h1>
                <p class="text-[7px] tracking-[0.4em] uppercase text-slate-500 font-bold">Universal Engineering Edition</p>
            </div>
        </div>
        <div class="hidden sm:block">
            <span class="text-[9px] text-slate-400 font-bold uppercase tracking-[0.2em] border border-white/10 px-4 py-2 rounded-full">ZCOER Student Portal</span>
        </div>
    </nav>

    <main class="flex-grow flex flex-col lg:flex-row p-6 gap-8 w-full max-w-[1400px] mx-auto">
        
        <aside class="lg:w-[350px] space-y-6 flex-shrink-0">
            <div class="glass p-8 rounded-[2.5rem] shadow-2xl space-y-8">
                <div>
                    <label class="block text-[10px] font-black text-blue-400 uppercase mb-3 tracking-widest">Academic Branch</label>
                    <select id="branch" class="w-full bg-slate-900/80 border border-white/10 rounded-2xl p-4 text-sm outline-none focus:ring-2 ring-blue-500 transition-all text-slate-200">
                        <option value="AIML">B.Tech AIML</option>
                        <option value="Computer">Computer Engineering</option>
                        <option value="Mechanical">Mechanical Engineering</option>
                        <option value="Civil">Civil Engineering</option>
                        <option value="Electrical">Electrical Engineering</option>
                        <option value="E&TC">E&TC Engineering</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-blue-400 uppercase mb-3 tracking-widest">Core Interest</label>
                    <input type="text" id="interest" placeholder="e.g. Robotics, App Dev, EV" 
                           class="w-full bg-slate-900/80 border border-white/10 rounded-2xl p-4 text-sm outline-none focus:ring-2 ring-blue-500 transition-all placeholder:text-slate-700">
                </div>

                <button id="generate-btn" class="w-full py-5 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black text-sm tracking-widest shadow-xl shadow-blue-500/20 transition-all active:scale-95 uppercase">
                    Generate Roadmap 🚀
                </button>
            </div>
        </aside>

        <section id="output-section" class="flex-grow hidden">
            <h2 class="text-2xl font-extrabold italic tracking-tight mb-8 gradient-text">4-Year Career Blueprint</h2>
            <div id="roadmap-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </section>
    </main>

    <footer class="p-8 text-center glass border-t border-white/5 mt-auto">
        <p class="text-[9px] text-slate-500 uppercase tracking-[0.4em] font-black mb-4">Architected & Engineered By</p>
        <div class="bg-gradient-to-r from-blue-600 to-cyan-500 p-[1.5px] rounded-full inline-block">
            <div class="bg-[#020617] px-8 py-2 rounded-full">
                <span class="text-xs font-black tracking-widest uppercase italic gradient-text">
                    Chetan Rameshwar Ugale
                </span>
            </div>
        </div>
    </footer>

    <script>
        // Use relative path if using vercel.json rewrites, or direct URL
        const API_URL = "/generate"; 

        document.getElementById('generate-btn').addEventListener('click', async () => {
            const branch = document.getElementById('branch').value;
            const interest = document.getElementById('interest').value;
            const btn = document.getElementById('generate-btn');
            const output = document.getElementById('output-section');
            const container = document.getElementById('roadmap-container');

            if (!interest.trim()) return alert("Bhai, focus area toh dalo!");

            btn.disabled = true;
            btn.innerHTML = `PROCESSING...`;
            output.classList.remove('hidden');
            container.innerHTML = `<div class="col-span-full py-20 text-center animate-pulse text-slate-500 font-bold uppercase tracking-widest">Analyzing Branch Data...</div>`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: `Act as a career expert for ${branch} engineering. Create a 4-year roadmap focused on ${interest}. Use markers YEAR_1:, YEAR_2:, YEAR_3:, YEAR_4: for each phase.` 
                    })
                });

                const data = await response.json();
                
                if (data.roadmap) {
                    const years = data.roadmap.split(/YEAR_\d:/i).filter(s => s.length > 20).slice(0, 4);
                    container.innerHTML = years.map((content, i) => `
                        <div class="bento-card glass p-8 rounded-[2.5rem]">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-blue-400 font-black text-[10px] uppercase tracking-widest">Year 0${i+1}</span>
                            </div>
                            <div class="text-slate-300 text-sm leading-relaxed">${content.replace(/\*/g, '').replace(/\n/g, '<br>')}</div>
                        </div>
                    `).join('');
                } else if (data.error) {
                    throw new Error(data.error);
                }
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-red-400 text-center py-10 glass rounded-2xl border-red-500/20">${err.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Generate Roadmap 🚀`;
            }
        });
    </script>
</body>
</html>
