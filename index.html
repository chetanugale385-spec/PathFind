<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFind AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen">
    <div class="max-w-md mx-auto p-6 text-center">
        <h1 class="text-3xl font-bold text-blue-400 mt-10">PathFind AI</h1>
        <p class="text-slate-400 mt-2">Professional Career Roadmaps</p>

        <div class="mt-10 space-y-4">
            <select id="branch" class="w-full p-4 bg-slate-800 rounded-xl border border-slate-700 outline-none">
                <option value="AIML">AIML</option>
                <option value="Data Science">Data Science</option>
                <option value="Cyber Security">Cyber Security</option>
            </select>

            <input type="text" id="interest" placeholder="Enter Interest (e.g. Python)" 
                   class="w-full p-4 bg-slate-800 rounded-xl border border-slate-700 outline-none">

            <button id="generate-btn" class="w-full p-4 bg-blue-600 hover:bg-blue-700 rounded-xl font-bold transition-all">
                Generate Roadmap
            </button>
        </div>

        <div id="output-section" class="mt-10 hidden text-left">
            <h2 class="text-xl font-semibold mb-4 text-blue-300">Your AI Roadmap:</h2>
            <div id="roadmap-container" class="p-6 bg-slate-900 border border-blue-500/30 rounded-2xl shadow-xl">
                </div>
        </div>
    </div>

<script>
    // 1. Backend URL (Verify karein ki spelling sahi hai)
    const API_URL = "https://pathfind.onrender.com/generate"; 

    document.getElementById('generate-btn').addEventListener('click', async () => {
        const branch = document.getElementById('branch').value;
        const interest = document.getElementById('interest').value;
        const button = document.getElementById('generate-btn');
        const outputSection = document.getElementById('output-section');
        const roadmapContainer = document.getElementById('roadmap-container');

        // Validation
        if (!interest.trim()) {
            alert("Bhai, pehle apna interest (e.g. Python) toh likho!");
            return;
        }

        // UI updates: Button disable aur loading state
        button.innerText = "AI is generating roadmap...";
        button.disabled = true;
        outputSection.classList.add('hidden');

        try {
            // 2. Fetch call with timeout logic
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    prompt: `B.Tech ${branch} student. Focus on ${interest}.` 
                })
            });

            // Agar server 404 ya 500 de
            if (!response.ok) {
                throw new Error(`Server Error: ${response.status}`);
            }

            const data = await response.json();

            // 3. Display Result
            if (data.roadmap) {
                outputSection.classList.remove('hidden');
                roadmapContainer.innerHTML = `
                    <div class="p-5 bg-slate-900 border-l-4 border-blue-500 rounded-r-xl text-slate-200">
                        <p class="whitespace-pre-wrap leading-relaxed text-sm md:text-base">
                            ${data.roadmap}
                        </p>
                    </div>
                `;
            } else {
                throw new Error("Empty roadmap received");
            }

        } catch (error) {
            console.error("Error details:", error);
            alert("Server abhi jaag raha hai (Waking up). Kripya 20-30 seconds baad phir se button dabayein.");
        } finally {
            // Button wapas enable karna
            button.innerText = "Generate My Roadmap";
            button.disabled = false;
        }
    });
</script>
